# Tiny Tapeout project information
project:
  title:       "(IEEE) USP OpenSilicio Didactic Testchip"
  author:      "USP OpenSilicio Group (IEEE)"
  discord:     ""
  description: "Didactic chip for teaching CMOS design at USP. Three modules: a 7-gate logic library, an 11-stage SKY130 ring oscillator with analog output, and a phase-frequency detector (PFD)."
  language:    "Verilog"
  clock_hz:    0       # Design is fully asynchronous (no board clock used)

  # A single tile is about 167x108 uM.
  tiles: "1x1"

  top_module: "tt_um_usp_didactic"

  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank.
# This section is for the datasheet/website.
pinout:
  # Inputs
  ui[0]: "clk_ref — PFD reference clock input"
  ui[1]: "clk_vco — PFD VCO clock input"
  ui[2]: "gate_sel[0] — logic gate selector bit 0"
  ui[3]: "gate_sel[1] — logic gate selector bit 1"
  ui[4]: "gate_sel[2] — logic gate selector bit 2"
  ui[5]: "A — logic gate input A"
  ui[6]: "B — logic gate input B"
  ui[7]: "ring_osc_enable — enable ring oscillator (active high)"

  # Outputs
  uo[0]: "selected gate output (mux of 7 gates via gate_sel)"
  uo[1]: "NOT(A)"
  uo[2]: "AND(A,B)"
  uo[3]: "OR(A,B)"
  uo[4]: "XOR(A,B)"
  uo[5]: "NAND(A,B)"
  uo[6]: "NOR(A,B)"
  uo[7]: "XNOR(A,B)"

  # Bidirectional pins
  uio[0]: "UP — PFD up signal (output)"
  uio[1]: "DOWN — PFD down signal (output)"
  uio[2]: "ring_osc /1024 — divided ring oscillator output (output)"
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
